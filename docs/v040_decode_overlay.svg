<text class="legend" x="864" y="168">upstream main (efdadd4), its own defaults</text>
<text class="note" x="78" y="514">The prose line is the floor test: W&amp;P continuation is adversarial for draft acceptance. The C-source line is the favorable category. Both ride identical ship defaults; the spread between them is corpus, not configuration.</text>
<text class="note" x="78" y="530">Plain line measured to 64k (low band). Ratios are computed from the plotted points: geometric mean over 2k-32k, floor = worst common point. Upstream = its server defaults (thinking, no MTP), cross-checked within 2% of its engine-side decode log. GB10 = DGX Spark, sm_121, same GGUF everywhere. 2026-07-21.</text>
