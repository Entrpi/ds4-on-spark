<text class="note" x="78" y="478">Points at 2k-8k are single-run volatile on this instrument; points at 10k+ repeat within 1% run to run. The low-end multiplier is the 2k-32k geometric-mean ratio, not a single point; the deep multiplier is the single 128k point.</text>
<text class="note" x="78" y="494">Gen lines are single-stream benchy wall tok/s (fork token_ids-exact; upstream cross-checked within 2% of its own engine-side decode log). Fork = launch defaults (continuous batching + capture, DSpark armed, quench governing). Upstream = its server defaults (thinking mode, no MTP — its single-token MTP is net-negative single-stream).</text>
<text class="note" x="78" y="510">GB10 = DGX Spark, sm_121, self-load boots, both engines on the same DeepSeek-V4-Flash GGUF. 2026-07-21.</text>
